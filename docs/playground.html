<title>वाक् · क्रीडाक्षेत्रम् — run Sanskrit in your browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ink:#16223f; --ink-soft:#4a5570; --ink-faint:#7c8499; --paper:#f7f6f1;
  --paper-2:#eeece4; --rule:#cfcdc2; --gold:#a8781f; --gold-lit:#f0e4c4;
  --indigo:#37508c; --crimson:#9a3324; --good:#2f6b45;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink:#e6e3d9; --ink-soft:#a9aec0; --ink-faint:#767d92; --paper:#10141f;
    --paper-2:#171c2b; --rule:#2c3346; --gold:#d8a94a; --gold-lit:#2a2415;
    --indigo:#8aa2df; --crimson:#e0806e; --good:#6fbf8e;
  }
}
:root[data-theme="light"] {
  --ink:#16223f; --ink-soft:#4a5570; --ink-faint:#7c8499; --paper:#f7f6f1;
  --paper-2:#eeece4; --rule:#cfcdc2; --gold:#a8781f; --gold-lit:#f0e4c4;
  --indigo:#37508c; --crimson:#9a3324; --good:#2f6b45;
}
:root[data-theme="dark"] {
  --ink:#e6e3d9; --ink-soft:#a9aec0; --ink-faint:#767d92; --paper:#10141f;
  --paper-2:#171c2b; --rule:#2c3346; --gold:#d8a94a; --gold-lit:#2a2415;
  --indigo:#8aa2df; --crimson:#e0806e; --good:#6fbf8e;
}
html {
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,
          "Nirmala UI","Noto Serif Devanagari",serif;
  --sans:"Segoe UI",-apple-system,"Helvetica Neue",Arial,"Nirmala UI",
         "Noto Sans Devanagari",sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono","Nirmala UI",
         "Noto Sans Devanagari",monospace;
  box-sizing:border-box; -webkit-text-size-adjust:100%;
}
*,*::before,*::after { box-sizing:inherit; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:16px; line-height:1.6;
  min-height:100vh; display:flex; flex-direction:column;
}
header {
  border-bottom:1.5px solid var(--ink); padding:1.1rem clamp(1rem,3vw,2rem) .7rem;
  display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
}
header h1 { margin:0; font-size:1.6rem; font-weight:500; letter-spacing:-.01em; }
header .sub {
  margin:0; font-family:var(--sans); font-size:.75rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-faint);
}
header .spacer { flex:1; }
header a { color:var(--gold); font-family:var(--sans); font-size:.8rem; }

main {
  flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0;
  min-height:0; border-bottom:1.5px solid var(--ink);
}
.pane { display:flex; flex-direction:column; min-width:0; min-height:22rem; }
.pane + .pane { border-left:1px solid var(--rule); }
.bar {
  display:flex; align-items:center; gap:.4rem; flex-wrap:wrap;
  padding:.5rem clamp(.7rem,2vw,1.1rem); border-bottom:1px solid var(--rule);
  background:var(--paper-2);
}
.bar .label {
  font-family:var(--sans); font-size:.7rem; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-faint); margin-right:.2rem;
}
.bar .spacer { flex:1; }
button, select {
  font:inherit; font-family:var(--sans); font-size:.76rem; letter-spacing:.02em;
  color:var(--ink-soft); background:transparent; border:1px solid var(--rule);
  border-radius:2px; padding:.3rem .62rem; cursor:pointer;
}
button:hover:not(:disabled), button:focus-visible,
select:hover, select:focus-visible { border-color:var(--gold); color:var(--gold); }
button:disabled { opacity:.45; cursor:progress; }
button.go { border-color:var(--gold); color:var(--gold); font-weight:600; }
button.go:hover:not(:disabled) { background:var(--gold-lit); }

textarea, pre.out {
  flex:1; margin:0; padding:.9rem clamp(.7rem,2vw,1.1rem);
  font-family:var(--mono); font-size:.86rem; line-height:1.72;
  background:var(--paper); color:var(--ink); border:0; resize:none;
  overflow:auto; white-space:pre; tab-size:4;
}
textarea:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
pre.out { color:var(--ink-soft); }
pre.out .err { color:var(--crimson); }
pre.out .ok { color:var(--good); }
pre.out .dim { color:var(--ink-faint); font-style:italic; }

footer {
  padding:.6rem clamp(1rem,3vw,2rem); font-family:var(--sans); font-size:.73rem;
  color:var(--ink-faint); display:flex; gap:1rem; flex-wrap:wrap;
  align-items:center;
}
footer .spacer { flex:1; }
footer b { color:var(--ink-soft); font-weight:500; }

@media (max-width:52rem) {
  main { grid-template-columns:1fr; }
  .pane + .pane { border-left:0; border-top:1px solid var(--rule); }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

<header>
  <h1>वाक्</h1>
  <p class="sub">क्रीडाक्षेत्रम् · playground</p>
  <span class="spacer"></span>
  <a href="index.html">← वाक्</a>
  <a href="manual.html">पुस्तिका · the manual</a>
  <button id="theme" type="button">theme</button>
</header>

<main>
  <section class="pane">
    <div class="bar">
      <span class="label">प्रोग्रामः</span>
      <select id="samples" aria-label="Load an example"></select>
      <span class="spacer"></span>
      <button id="check" type="button">परीक्षा · check</button>
      <button id="run" class="go" type="button">चालय · run ⏎</button>
    </div>
    <textarea id="src" spellcheck="false" aria-label="Vāk source"></textarea>
  </section>

  <section class="pane">
    <div class="bar">
      <span class="label">फलम्</span>
      <span class="spacer"></span>
      <button id="clear" type="button">रिक्तम् · clear</button>
    </div>
    <pre class="out" id="out" aria-live="polite" aria-atomic="false"></pre>
  </section>
</main>

<footer>
  <span>वाक् 0.10.0 — the whole toolchain in WebAssembly: this page lexes,
  parses, analyses, compiles and runs Vāk itself.</span>
  <span class="spacer"></span>
  <span><b>Ctrl/⌘ + Enter</b> runs</span>
</footer>

<script>
(function () {
  "use strict";

  var SAMPLES = {"नमस्ते": "मुद्रय \"नमस्ते जगत्\"।\n\nशब्दः नाम = \"वाक्\"।\nपूर्णाङ्कः वर्षम् = २०२६।\nमुद्रय \"भाषायाः नाम:\", नाम।\nमुद्रय \"वर्षम्:\", देवनागरी(वर्षम्)।", "कारकाणि": "# कारकाणि — प्राचलः स्वकीयां भूमिकां घोषयति।\n# A parameter declares the role it plays in the action.\nकार्यम् छानय(अपादानम् सूची संग्रहः, करणम् कार्यम् परीक्षा) : सूची {\n    सूची फलम् = []।\n    प्रत्येकम् (अङ्गम् अन्तः संग्रहः) {\n        यदि (परीक्षा(अङ्गम्)) { योजय(फलम्, अङ्गम्)। }\n    }\n    प्रत्यागच्छ फलम्।\n}\n\nकार्यम् समः(पूर्णाङ्कः सङ्ख्या) : सत्यता {\n    प्रत्यागच्छ सङ्ख्या % २ == ०।\n}\n\nमान अङ्काः = [१, २, ३, ४, ५, ६, ७, ८]।\n\n# भूमिकाः अङ्किताः इति क्रमः न बध्नाति — त्रयोऽपि एकम् एव आह्वानम्।\nमुद्रय छानय(अङ्काः, समः)।\nमुद्रय छानय(अपादानम्: अङ्काः, करणम्: समः)।\nमुद्रय छानय(करणम्: समः, अपादानम्: अङ्काः)।", "विकल्पः": "कार्यम् वासरनाम(कर्म पूर्णाङ्कः वारः) : शब्दः {\n    विकल्पः (वारः) {\n        पक्षे १: प्रत्यागच्छ \"सोमवासरः\"।\n        पक्षे २, ३: प्रत्यागच्छ \"मङ्गलः बुधः वा\"।\n        पक्षे ६, ७: प्रत्यागच्छ \"सप्ताहान्तः\"।\n        अन्यथा: प्रत्यागच्छ \"अज्ञातः वासरः\"।\n    }\n}\n\nप्रत्येकम् (वारः अन्तः परास(१, ९)) {\n    मुद्रय देवनागरी(वारः), \"—\", वासरनाम(वारः)।\n}", "दोषनिग्रहः": "# प्रयत्नः — दोषे — अन्ततः\nकार्यम् भज(पूर्णाङ्कः अंशः, पूर्णाङ्कः हरः) : अङ्कः {\n    यदि (हरः == ०) {\n        उत्सृज { \"प्रकारः\": \"गणितदोषः\", \"सन्देशः\": \"शून्येन भागः न सम्भवति\" }।\n    }\n    प्रत्यागच्छ अंशः / हरः।\n}\n\nप्रत्येकम् (हरः अन्तः [२, ०, ५]) {\n    प्रयत्नः {\n        मुद्रय \"१००  /\", देवनागरी(हरः), \"=\", भज(१००, हरः)।\n    } दोषे (द) {\n        मुद्रय \"दोषः:\", द.प्रकारः, \"—\", द.सन्देशः।\n    } अन्ततः {\n        मुद्रय \"  (प्रयत्नः समाप्तः)\"।\n    }\n}", "ASCII": "# purnataya romanized — no Devanagari keyboard needed\nkaryam varga(purnankah a) : purnankah {\n    pratyagaccha a * a;\n}\n\nmudraya \"vargani / squares:\";\npratyekam (n antah [1, 2, 3, 4, 5]) {\n    mudraya \" \", n, \"->\", varga(n);\n}\n\npurnankah yoga = 0;\nyavat (yoga < 10) { yoga += 3; }\nmudraya \"yoga =\", yoga;", "गणितम्": "आनय \"गणितम्\" इति ग।\n\nमुद्रय \"पाई             =\", ग.पाई।\nमुद्रय \"वर्गः(१२)        =\", ग.वर्गः(१२)।\nमुद्रय \"क्रमगुणितम्(१०)   =\", ग.क्रमगुणितम्(१०)।\nमुद्रय \"मसाभा(४८, १८)   =\", ग.मसाभा(४८, १८)।\nमुद्रय \"अभाज्याः ३० यावत् =\", ग.अभाज्याः_यावत्(३०)।\nमुद्रय \"माध्यम् (कारकेण)  =\", ग.माध्यम्(अपादानम्: [१०, २०, ३०])।"};
  var LIBRARY = {"/vak/पुस्तकालयः/गणितम्.vak": "# गणितम् — the mathematics module of the Vāk standard library.\n# स्वयम् वाक्-भाषायाम् एव लिखितम् / written in Vāk itself.\n#\n#     आनय \"गणितम्\"।\n#     मुद्रय गणितम्.क्रमगुणितम्(५)।\n\nध्रुव दशांशः पाई = ३.१४१५९२६५३५८९७९३।\nध्रुव दशांशः ई = २.७१८२८१८२८४५९०४५।\n\nकार्यम् वर्गः(अङ्कः क) : अङ्कः {\n    प्रत्यागच्छ क * क।\n}\n\nकार्यम् घनः(अङ्कः क) : अङ्कः {\n    प्रत्यागच्छ क * क * क।\n}\n\nकार्यम् निरपेक्षम्(अङ्कः क) : अङ्कः {\n    यदि (क < ०) {\n        प्रत्यागच्छ ० - क।\n    }\n    प्रत्यागच्छ क।\n}\n\nकार्यम् चिह्नम्(अङ्कः क) : पूर्णाङ्कः {\n    यदि (क > ०) { प्रत्यागच्छ १। }\n    यदि (क < ०) { प्रत्यागच्छ -१। }\n    प्रत्यागच्छ ०।\n}\n\nकार्यम् क्रमगुणितम्(पूर्णाङ्कः न्) : पूर्णाङ्कः {\n    यदि (न् < ०) {\n        उत्सृज { \"प्रकारः\": \"मूल्यदोषः\", \"सन्देशः\": \"क्रमगुणितम् ऋणसंख्यायाः नास्ति\" }।\n    }\n    पूर्णाङ्कः फलम् = १।\n    प्रत्येकम् (क अन्तः परास(२, न् + १)) {\n        फलम् = फलम् * क।\n    }\n    प्रत्यागच्छ फलम्।\n}\n\n# महत्तमः साधारणः भाजकः — the greatest common divisor (Euclid)\nकार्यम् मसाभा(पूर्णाङ्कः अ, पूर्णाङ्कः ब) : पूर्णाङ्कः {\n    पूर्णाङ्कः क = पूर्ण(निरपेक्षम्(अ))।\n    पूर्णाङ्कः ख = पूर्ण(निरपेक्षम्(ब))।\n    यावत् (ख != ०) {\n        पूर्णाङ्कः शेषः = क % ख।\n        क = ख।\n        ख = शेषः।\n    }\n    प्रत्यागच्छ क।\n}\n\n# लघुत्तमः साधारणः गुणकः — the least common multiple\nकार्यम् लसागु(पूर्णाङ्कः अ, पूर्णाङ्कः ब) : पूर्णाङ्कः {\n    यदि (अ == ० वा ब == ०) {\n        प्रत्यागच्छ ०।\n    }\n    प्रत्यागच्छ पूर्ण(निरपेक्षम्(अ * ब) / मसाभा(अ, ब))।\n}\n\nकार्यम् अभाज्यः_वा(पूर्णाङ्कः न्) : सत्यता {\n    यदि (न् < २) { प्रत्यागच्छ असत्य। }\n    पूर्णाङ्कः भाजकः = २।\n    यावत् (भाजकः * भाजकः <= न्) {\n        यदि (न् % भाजकः == ०) {\n            प्रत्यागच्छ असत्य।\n        }\n        भाजकः = भाजकः + १।\n    }\n    प्रत्यागच्छ सत्य।\n}\n\nकार्यम् अभाज्याः_यावत्(पूर्णाङ्कः सीमा) : सूची {\n    सूची फलम् = []।\n    प्रत्येकम् (क अन्तः परास(२, सीमा + १)) {\n        यदि (अभाज्यः_वा(क)) {\n            योजय(फलम्, क)।\n        }\n    }\n    प्रत्यागच्छ फलम्।\n}\n\nकार्यम् माध्यम्(अपादानम् सूची अङ्काः) : अङ्कः {\n    यदि (दीर्घता(अङ्काः) == ०) {\n        उत्सृज { \"प्रकारः\": \"मूल्यदोषः\", \"सन्देशः\": \"रिक्तायाः सूच्याः माध्यमम् नास्ति\" }।\n    }\n    प्रत्यागच्छ योग(अङ्काः) / दीर्घता(अङ्काः)।\n}\n\nकार्यम् मध्यमा(अपादानम् सूची अङ्काः) : अङ्कः {\n    सूची क्रमिताः = क्रम(अङ्काः)।\n    पूर्णाङ्कः न् = दीर्घता(क्रमिताः)।\n    यदि (न् == ०) {\n        उत्सृज { \"प्रकारः\": \"मूल्यदोषः\", \"सन्देशः\": \"रिक्तायाः सूच्याः मध्यमा नास्ति\" }।\n    }\n    यदि (न् % २ == १) {\n        प्रत्यागच्छ क्रमिताः[पूर्ण(न् / २)]।\n    }\n    प्रत्यागच्छ (क्रमिताः[पूर्ण(न् / २) - १] + क्रमिताः[पूर्ण(न् / २)]) / २।\n}\n\nकार्यम् घातः(अङ्कः आधारः, पूर्णाङ्कः घाताङ्कः) : अङ्कः {\n    प्रत्यागच्छ आधारः ^ घाताङ्कः।\n}\n", "/vak/पुस्तकालयः/शब्दाः.vak": "# शब्दाः — the string module of the Vāk standard library.\n# स्वयम् वाक्-भाषायाम् एव लिखितम् / written in Vāk itself.\n#\n#     आनय \"शब्दाः\" तः विलोमः_वा, पुनरावृत्तिः।\n\nकार्यम् आदौ_अस्ति(अधिकरणम् शब्दः पूर्णः, कर्म शब्दः आदिः) : सत्यता {\n    पूर्णाङ्कः न् = दीर्घता(आदिः)।\n    यदि (न् > दीर्घता(पूर्णः)) {\n        प्रत्यागच्छ असत्य।\n    }\n    प्रत्येकम् (क अन्तः परास(०, न्)) {\n        यदि (पूर्णः[क] != आदिः[क]) {\n            प्रत्यागच्छ असत्य।\n        }\n    }\n    प्रत्यागच्छ सत्य।\n}\n\nकार्यम् अन्ते_अस्ति(अधिकरणम् शब्दः पूर्णः, कर्म शब्दः अन्तः_) : सत्यता {\n    पूर्णाङ्कः न् = दीर्घता(अन्तः_)।\n    पूर्णाङ्कः म् = दीर्घता(पूर्णः)।\n    यदि (न् > म्) {\n        प्रत्यागच्छ असत्य।\n    }\n    प्रत्येकम् (क अन्तः परास(०, न्)) {\n        यदि (पूर्णः[म् - न् + क] != अन्तः_[क]) {\n            प्रत्यागच्छ असत्य।\n        }\n    }\n    प्रत्यागच्छ सत्य।\n}\n\nकार्यम् पुनरावृत्तिः(कर्म शब्दः स, पूर्णाङ्कः वारम्) : शब्दः {\n    शब्दः फलम् = \"\"।\n    आवृत्तिः (वारम्) {\n        फलम् = फलम् + स।\n    }\n    प्रत्यागच्छ फलम्।\n}\n\nकार्यम् पूरय(कर्म शब्दः स, पूर्णाङ्कः दैर्घ्यम्, शब्दः अक्षरम्) : शब्दः {\n    शब्दः फलम् = स।\n    यावत् (दीर्घता(फलम्) < दैर्घ्यम्) {\n        फलम् = अक्षरम् + फलम्।\n    }\n    प्रत्यागच्छ फलम्।\n}\n\n# अक्षरशः विभजनम् — वर्णैः न, अक्षरैः। \"वाक्\" → [\"वा\", \"क्\"]\nकार्यम् अक्षरसूची(कर्म शब्दः स) : सूची {\n    प्रत्यागच्छ अक्षराणि(स)।\n}\n\nकार्यम् विलोमः_वा(कर्म शब्दः स) : सत्यता {\n    प्रत्यागच्छ स == विपर्यय(स)।\n}\n\nकार्यम् गणय_अक्षरम्(कर्म शब्दः अक्षरम्, अधिकरणम् शब्दः वाक्यम्) : पूर्णाङ्कः {\n    पूर्णाङ्कः गणना = ०।\n    प्रत्येकम् (अ अन्तः वाक्यम्) {\n        यदि (अ == अक्षरम्) {\n            गणना = गणना + १।\n        }\n    }\n    प्रत्यागच्छ गणना।\n}\n\nकार्यम् शब्दगणना(अधिकरणम् शब्दः वाक्यम्) : कोशः {\n    कोशः गणना = {}।\n    प्रत्येकम् (पदम् अन्तः विभज(वाक्यम्, \" \")) {\n        यदि (पदम् != \"\") {\n            यदि (अस्ति(गणना, पदम्)) {\n                गणना[पदम्] = गणना[पदम्] + १।\n            } अन्यथा {\n                गणना[पदम्] = १।\n            }\n        }\n    }\n    प्रत्यागच्छ गणना।\n}\n"};

  var src = document.getElementById("src");
  var out = document.getElementById("out");
  var runBtn = document.getElementById("run");
  var checkBtn = document.getElementById("check");
  var picker = document.getElementById("samples");
  var names = Object.keys(SAMPLES);

  names.forEach(function (n) {
    var o = document.createElement("option");
    o.value = n; o.textContent = n;
    picker.appendChild(o);
  });
  /* आगतः सङ्केतः — a program handed over in the URL, from the landing page.
     Base64 of the UTF-8 bytes, so Devanagari survives the trip. */
  function fromHash() {
    var m = /[#&]code=([^&]+)/.exec(location.hash || "");
    if (!m) return null;
    try {
      var bin = atob(decodeURIComponent(m[1]).replace(/-/g, "+").replace(/_/g, "/"));
      var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
      return new TextDecoder().decode(bytes);
    } catch (e) { return null; }
  }
  var handed = fromHash();
  src.value = handed || SAMPLES[names[0]];
  picker.addEventListener("change", function () {
    src.value = SAMPLES[picker.value];
    src.focus();
  });

  function write(text, cls) {
    var span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text + "\n";
    out.appendChild(span);
    out.scrollTop = out.scrollHeight;
  }
  document.getElementById("clear").addEventListener("click", function () {
    out.textContent = "";
  });

  /* एकम् एव यन्त्रम् — a fresh module per run, so one program's state can never
     leak into the next.  Instantiation is cheap; the wasm is already compiled. */
  var lines = [];
  function boot() {
    return VakModule({
      noInitialRun: true,
      print: function (t) { lines.push(["", t]); },
      printErr: function (t) { lines.push(["err", t]); },
    });
  }

  function go(check) {
    lines = [];
    runBtn.disabled = checkBtn.disabled = true;
    var started = performance.now();
    boot().then(function (mod) {
      Object.keys(LIBRARY).forEach(function (path) {
        var dir = path.slice(0, path.lastIndexOf("/"));
        try { mod.FS.mkdirTree(dir); } catch (e) { /* already there */ }
        mod.FS.writeFile(path, LIBRARY[path]);
      });
      mod.FS.writeFile("/program.vak", src.value);
      var args = check ? ["--परीक्षा", "/program.vak"] : ["/program.vak"];
      try {
        mod.callMain(args);
      } catch (e) {
        lines.push(["err", String(e && e.message ? e.message : e)]);
      }
      var ms = Math.round(performance.now() - started);
      lines.forEach(function (l) { write(l[1], l[0]); });
      if (!lines.length) write(check ? "अर्थविश्लेषणम् निर्दोषम्" : "(फलम् नास्ति)", "dim");
      write("— " + (check ? "परीक्षा" : "चालनम्") + " " + ms + " ms —", "dim");
      runBtn.disabled = checkBtn.disabled = false;
      src.focus();
    }).catch(function (e) {
      write("यन्त्रदोषः / the engine failed to start: " + e, "err");
      runBtn.disabled = checkBtn.disabled = false;
    });
  }

  runBtn.addEventListener("click", function () { go(false); });
  checkBtn.addEventListener("click", function () { go(true); });
  src.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); go(false); }
    if (e.key === "Tab") {
      e.preventDefault();
      var a = src.selectionStart, b = src.selectionEnd;
      src.value = src.value.slice(0, a) + "    " + src.value.slice(b);
      src.selectionStart = src.selectionEnd = a + 4;
    }
  });

  document.getElementById("theme").addEventListener("click", function () {
    var now = document.documentElement.dataset.theme;
    if (!now) {
      now = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = now === "dark" ? "light" : "dark";
  });

  write("वाक् 0.10.0 — सिद्धम्। 'चालय' इति नुदतु।", "ok");
  write("ready — press Run, or Ctrl/⌘+Enter.", "dim");
  if (handed) go(false);          /* it was sent here to be run */
})();
</script>
