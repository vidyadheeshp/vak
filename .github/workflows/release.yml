name: विमोचनम् · release

# Runs when a version tag is pushed. Builds the standalone binary on all three
# desktop platforms and attaches them to the GitHub release, so the "Windows
# only" limitation goes away for anyone downloading a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: वाक् binary · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: vak-linux-x86_64
          - os: macos-latest
            asset: vak-macos-arm64
          - os: windows-latest
            asset: vak-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      # A Devanagari output path cannot be opened by MinGW's linker, so the
      # native back end builds under a derived ASCII name — वाक् becomes
      # vak_adc6e74a. Guessing that name is how this step failed before; it
      # now reads the path the tool reports.
      - name: Build the self-hosted toolchain natively
        shell: bash
        run: |
          mkdir -p out
          python -m vaak --native "स्वयंसिद्धिः/वाक्.vak" 2>&1 | tee build.log
          built=$(sed -n 's/.*built: //p' build.log | tail -1)
          built="${built%$'\r'}"
          if [ -z "$built" ] || [ ! -f "$built" ]; then
            echo "::error::no binary produced"
            cat build.log
            exit 1
          fi
          echo "built: $built"
          cp "$built" "out/${{ matrix.asset }}"
          ls -la out/

      # A binary that builds but does not run is worse than a failed build,
      # because it ships.
      - name: The binary must actually run
        shell: bash
        run: |
          chmod +x "out/${{ matrix.asset }}" || true
          printf 'मुद्रय "नमस्ते जगत्"।\n' > smoke.vak
          got=$("./out/${{ matrix.asset }}" smoke.vak | tr -d '\r')
          echo "got: [$got]"
          test "$got" = "नमस्ते जगत्"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  wheel:
    name: वितरणम् · wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  extension:
    name: सम्पादकः · the editor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e .

      # The grammar is generated from vaak/tokens.py, so it is rebuilt here
      # rather than trusted. A .vsix cut from a stale tree would highlight a
      # language slightly different from the one in the same release.
      - name: Rebuild it from the language's own tables
        run: python vscode-vak/build_extension.py
      - name: Refuse to package a stale tree
        run: |
          if ! git diff --quiet -- vscode-vak/; then
            echo "::error::vscode-vak/ is stale — run python vscode-vak/build_extension.py and commit the result"
            git diff --stat -- vscode-vak/
            exit 1
          fi

      - name: Package
        working-directory: vscode-vak
        run: npx --yes @vscode/vsce@3.2.1 package --no-dependencies

      # vsce reports a file count and a size; what is in the archive is
      # whatever .vscodeignore happened to catch. This says what is in it.
      - name: What is inside must be what we meant to ship
        run: python vscode-vak/check_vsix.py "$(ls vscode-vak/*.vsix)"

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-vak/*.vsix

  # Publishing to the Marketplace needs a Personal Access Token from an Azure
  # DevOps organisation, stored as the VSCE_PAT secret, and a publisher named
  # in package.json that the token can publish for. Until both exist this job
  # would fail and redden an otherwise good release, so it stays switched off
  # behind a repository variable: set PUBLISH_TO_MARKETPLACE to "true" when
  # the token is in place. The .vsix is attached to the release either way,
  # so the extension is installable without ever turning this on.
  marketplace:
    name: Marketplace · publish the extension
    needs: [extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_MARKETPLACE == 'true'
    environment: marketplace
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: vsix
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.2.1 publish --packagePath "$(ls vsix/*.vsix)"

  # Publishing to PyPI needs a trusted publisher configured on PyPI's side
  # first (Manage project -> Publishing -> add a GitHub publisher for this
  # repo and workflow). Until then this job would fail and put a red mark on
  # an otherwise good release, so it stays switched off behind a repository
  # variable: set PUBLISH_TO_PYPI to "true" once PyPI is ready.
  pypi:
    name: PyPI · publish the wheel
    needs: [binaries, wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write        # trusted publishing — no token to store or leak
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish:
    name: विमोचनम् · attach everything to the release
    needs: [binaries, wheel, extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
