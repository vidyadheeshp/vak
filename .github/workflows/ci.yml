name: परीक्षा · tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The five-engine differential is the project's correctness guarantee, so it
  # has to run everywhere — the C runtime is where platform differences live.
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show the toolchain
        run: |
          python -m vaak --version
          python -c "import shutil; print('cc:', shutil.which('gcc') or shutil.which('clang') or 'none')"

      - name: परीक्षाः · run the test suite
        run: python -m pytest tests/ -q

      - name: Every example, through the interpreter
        shell: bash
        run: |
          for f in examples/[0-9][0-9]_*.vak; do
            echo "-- $f"
            python -m vaak "$f" > /dev/null
          done

  # The documentation is generated from the language's own tables and refuses to
  # build when they have drifted, so building it is a real check.
  docs:
    name: पुस्तिका · docs regenerate cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      # The playground embeds a WebAssembly build that needs Emscripten and is
      # not checked in, so it is regenerated by hand and excluded here.
      - name: Regenerate the generated pages
        run: |
          python docs/build_landing.py
          python docs/build_manual.py
          python docs/build_story.py
      - name: Fail if the committed pages are out of date
        run: |
          if ! git diff --quiet -- docs/index.html docs/manual.html docs/story.html; then
            echo "::error::docs/ is stale — run the generators and commit the result"
            git diff --stat -- docs/
            exit 1
          fi
          echo "documentation is current"

  # Proves the wheel installs and runs somewhere that has never seen the repo,
  # which is the thing a user actually does.
  package:
    name: वितरणम् · the wheel installs and runs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel outside the source tree
        shell: bash
        run: |
          python -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          printf 'मुद्रय "नमस्ते जगत्"।\n' > pariksha.vak
          vaak --version
          out=$(vaak pariksha.vak)
          echo "got: $out"
          test "$out" = "नमस्ते जगत्"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/*

  # The native back end emits C and links it; this is the only job that proves
  # the POSIX branches in native/ actually compile.
  native:
    name: देशीयसंकलनम् · native build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Compile and run an example natively
        run: python -m vaak --run-native examples/01_namaste.vak
